<!--
 独立全屏海报墙页面（局域网访问入口）。

 任何设备打开 `http://<server>:<port>/api/v1/plugin/FullScreenPosterWall/lan-wall`
 都能直接看完整全屏播放效果，不需要登录 MoviePilot、也不进入主框架 SPA。
 数据通过同一个 plugin 暴露的 /public-data 接口获取（allow_anonymous=True）。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>全屏海报墙 · 局域网</title>
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: rgba(255,255,255,0.75);
    --primary: #818cf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; }
  body { position: relative; }
  #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
    pointer-events: none;
  }
  .topbar .pill {
    pointer-events: auto;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
  }
  .topbar .pill .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 6px; }

  /* 照片 */
  .effect-photos .photo-frame { position: absolute; inset: 0; }
  .effect-photos .photo-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    animation: kenburns 14s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    0%   { transform: scale(1.05) translate(0,0); }
    100% { transform: scale(1.18) translate(-1.5%, -1%); }
  }
  .effect-photos .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0) 70%);
    display: flex; align-items: flex-end; padding: 60px 80px;
  }
  .effect-photos.no-text .photo-overlay { display: none !important; }
  .effect-photos .photo-meta h1 { font-size: 56px; margin: 0; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .effect-photos .photo-sub { font-size: 18px; opacity: .85; margin: 8px 0; }
  .effect-photos .photo-overview { font-size: 16px; opacity: .8; max-width: 720px; line-height: 1.6; margin-top: 12px; }
  .effect-photos .fade-enter-active, .effect-photos .fade-leave-active { transition: opacity 1.4s ease; }
  .effect-photos .fade-enter-from, .effect-photos .fade-leave-to { opacity: 0; }

  /* 浮动 */
  .effect-floating .float-root { width: 100vw; height: 100vh; background: linear-gradient(135deg, #0a0a0a, #1a1a2e); position: relative; overflow: hidden; }
  .effect-floating .float-card {
    position: absolute; top: 0; left: 0;
    background: #111; border-radius: 8px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: opacity 1.2s ease;
    will-change: transform, opacity;
  }
  .effect-floating .float-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .effect-floating .float-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 8px 10px; background: linear-gradient(transparent, rgba(0,0,0,.85));
    color: #fff;
  }
  .effect-floating .float-caption-title {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .effect-floating .float-caption-overview {
    font-size: 11px; opacity: .8; margin-top: 3px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .effect-floating.no-text .float-caption { display: none !important; }

  /* 怀旧冲印 */
  .effect-vintage .vintage-root { width: 100vw; height: 100vh; background: #2b1d12; overflow: hidden; position: relative; }
  .effect-vintage .vintage-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: sepia(0.75) contrast(1.05) brightness(0.92); }
  .effect-vintage canvas.grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: 0.35; pointer-events: none; }
  .effect-vintage .vintage-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 90%); pointer-events: none; }
  .effect-vintage .vintage-meta {
    position: absolute; right: 0; top: 0;
    text-align: right; color: #f5e9d0; padding: 46px 48px 40px 60px;
    background: linear-gradient(rgba(0,0,0,0.7), transparent);
    pointer-events: none;
  }
  .effect-vintage .vintage-title { font-family: Georgia, serif; font-size: 42px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .effect-vintage .vintage-sub { font-size: 16px; opacity: 0.8; margin-top: 6px; letter-spacing: 0.1em; }
  .effect-vintage .vintage-overview { font-size: 14px; opacity: 0.75; max-width: 640px; margin: 10px 0 0 auto; line-height: 1.6; }
  .effect-vintage.no-text .vintage-meta { display: none !important; }

  /* 光舞 */
  .effect-lightdance .light-root { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }
  .effect-lightdance .light-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: blur(4px) brightness(0.55) saturate(1.3);
    transform: scale(1.1);
    transition: opacity 1.5s ease;
  }
  .effect-lightdance .light-conic {
    position: absolute; inset: -20%;
    background: conic-gradient(from 0deg at 50% 50%,
      hsla(280, 90%, 60%, 0.4),
      hsla(180, 90%, 60%, 0.4),
      hsla(60, 90%, 60%, 0.4),
      hsla(20, 90%, 60%, 0.4),
      hsla(280, 90%, 60%, 0.4));
    mix-blend-mode: screen;
    opacity: 0.6;
    animation: spin 22s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .effect-lightdance .light-orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .effect-lightdance .light-meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 32px 50px 50px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    pointer-events: none;
  }
  .effect-lightdance .light-title { font-size: 44px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .effect-lightdance .light-sub { font-size: 14px; opacity: .75; margin-top: 4px; }
  .effect-lightdance .light-overview { font-size: 14px; opacity: .8; max-width: 640px; line-height: 1.6; margin-top: 10px; }
  .effect-lightdance.no-text .light-meta { display: none !important; }

  /* 片名 Logo 叠层（logo 模式：标题文字替换为艺术字图）；横版 Logo 底部居中 */
  .meta-logo { max-width: 420px; max-height: 130px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 4px 16px rgba(0,0,0,.65)); }
  .meta-center { left: 0 !important; right: 0 !important; width: 100% !important; max-width: none !important; text-align: center !important; align-items: center !important; }
  .meta-center .meta-logo { margin: 0 auto; object-position: center bottom; }
  .effect-shiftingtiles .ctile-logo {
    position: absolute; inset: 0; margin: auto;
    /* 宽度驱动：始终随瓷砖宽度缩放（高度只做兜底约束） */
    width: 62%; height: auto; max-height: 62%; object-fit: contain;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.65)); pointer-events: none;
  }
  .effect-shiftingtiles .ctile-logo.logo-wide {
    inset: auto; margin: 0; left: 50%; bottom: 8%;
    width: 56%; transform: translateX(-50%);
  }

  /* 拼拼贴（复刻 macOS 滑动照片面板：双轨道 + 推挤碰撞 + 垂直抽离） */
  .effect-pinpintie .ppt-root { position: absolute; inset: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; }
  .effect-pinpintie .ppt-track { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .effect-pinpintie .ppt-tile {
    position: absolute; top: 0; bottom: 0;
    overflow: hidden; background: #000;
    padding: 2px; box-sizing: border-box;   /* 4px 均匀黑色间隙 */
    will-change: left, width, transform;
  }
  .effect-pinpintie .ppt-tile > img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .effect-pinpintie .ppt-logo {
    position: absolute; inset: 0; margin: auto;
    max-width: 70%; max-height: 55%; width: auto; height: auto;
    object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.65)); pointer-events: none;
  }
  .effect-pinpintie .ppt-logo.logo-wide {
    inset: auto; margin: 0; left: 50%; bottom: 8%; transform: translateX(-50%);
  }

  /* 倒数 3 秒进入全屏的遮罩 */
  .fs-countdown {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.72);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; cursor: pointer;
    transition: opacity .5s ease;
  }
  .fs-countdown.fs-cd-fade { opacity: 0; pointer-events: none; }
  /* 降级：不遮挡画面的右下角小提示 */
  .fs-countdown.fs-cd-mini {
    inset: auto; right: 18px; bottom: 18px;
    background: rgba(20,20,24,.85);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 10px 18px;
    display: block;
    cursor: pointer;
  }
  .fs-countdown.fs-cd-mini .fs-cd-hint { font-size: 13px; opacity: .9; margin: 0; }
  .fs-cd-num { font-size: 120px; font-weight: 800; line-height: 1; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  .fs-cd-hint { font-size: 16px; opacity: .75; margin-top: 18px; }

  /* 环形画廊：3D 圆柱环 + 步进旋转聚焦 */
  .effect-ring3d .rg-root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #101318 0%, #000 70%); }
  /* 极光光斑：两团缓慢漂移的柔光 */
  .effect-ring3d .rg-aurora {
    position: absolute; width: 55vmax; height: 55vmax;
    border-radius: 50%; filter: blur(90px);
    pointer-events: none; opacity: 0.16;
  }
  .effect-ring3d .rg-aurora.a1 {
    left: -10%; top: -15%;
    background: radial-gradient(circle, #3b5bdb 0%, transparent 65%);
    animation: rg-aurora-1 26s ease-in-out infinite alternate;
  }
  .effect-ring3d .rg-aurora.a2 {
    right: -15%; bottom: -20%;
    background: radial-gradient(circle, #9775fa 0%, transparent 65%);
    animation: rg-aurora-2 34s ease-in-out infinite alternate;
  }
  @keyframes rg-aurora-1 { from { transform: translate(0,0) scale(1); } to { transform: translate(22vw,14vh) scale(1.25); } }
  @keyframes rg-aurora-2 { from { transform: translate(0,0) scale(1.15); } to { transform: translate(-18vw,-12vh) scale(0.9); } }
  /* 微尘光点：两层不同大小/速度的光点缓缓上升 */
  .effect-ring3d .rg-dust { position: absolute; inset: -100% 0 0 0; pointer-events: none; background-repeat: repeat; }
  .effect-ring3d .rg-dust.d1 {
    background-image:
      radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.4px 1.4px at 38% 68%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.8px 1.8px at 64% 12%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 82% 46%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 52% 88%, rgba(255,255,255,.45), transparent);
    background-size: 480px 480px;
    animation: rg-rise 46s linear infinite; opacity: .5;
  }
  .effect-ring3d .rg-dust.d2 {
    background-image:
      radial-gradient(2.4px 2.4px at 24% 56%, rgba(255,255,255,.6), transparent),
      radial-gradient(2.1px 2.1px at 58% 34%, rgba(255,255,255,.45), transparent),
      radial-gradient(2.6px 2.6px at 76% 78%, rgba(255,255,255,.55), transparent);
    background-size: 720px 720px;
    animation: rg-rise 30s linear infinite; opacity: .4;
  }
  @keyframes rg-rise { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .effect-ring3d .rg-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 42%; }
  .effect-ring3d .rg-ring { position: absolute; left: 50%; top: 42%; width: 0; height: 0; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.22, 0.68, 0.24, 1); }
  .effect-ring3d .rg-card {
    position: absolute; overflow: hidden; background: #000;
    width: min(50vw, 730px); height: min(60vh, 675px);
    left: calc(min(50vw, 730px) / -2); top: calc(min(60vh, 675px) / -2);
    backface-visibility: hidden;
    filter: brightness(0.45) saturate(0.8);
    transition: filter 1.2s ease, transform 1.2s cubic-bezier(0.22, 0.68, 0.24, 1);
  }
  .effect-ring3d .rg-card.front { filter: brightness(1) saturate(1); }
  .effect-ring3d .rg-card img:not(.rg-logo) { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .effect-ring3d .rg-logo { position: absolute; inset: 0; margin: auto; max-width: 75%; max-height: 55%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.65)); pointer-events: none; }
  .effect-ring3d .rg-logo.logo-wide { inset: auto; margin: 0; left: 50%; bottom: 8%; transform: translateX(-50%); }
  .effect-ring3d .rg-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: linear-gradient(to top, rgba(255,255,255,0.05), transparent); pointer-events: none; }
  .effect-ring3d .rg-meta { position: absolute; left: 48px; bottom: 42px; max-width: 560px; color: #fff; z-index: 3; }
  .effect-ring3d .rg-title { font-size: 42px; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .effect-ring3d .rg-sub { font-size: 15px; opacity: .8; margin-top: 6px; }
  .effect-ring3d .rg-overview { font-size: 14px; opacity: .85; margin-top: 10px; line-height: 1.6; }
  .effect-ring3d .rg-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .effect-ring3d.no-text .rg-meta { display: none !important; }

  /* 像素溶解：Canvas 随机像素块点亮过渡 */
  .effect-pixeldissolve .px-root { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .effect-pixeldissolve .px-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .effect-pixeldissolve .px-meta { position: absolute; left: 48px; bottom: 42px; max-width: 560px; color: #fff; z-index: 3; }
  .effect-pixeldissolve .px-title { font-size: 42px; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .effect-pixeldissolve .px-sub { font-size: 15px; opacity: .8; margin-top: 6px; }
  .effect-pixeldissolve .px-overview { font-size: 14px; opacity: .85; margin-top: 10px; line-height: 1.6; }
  .effect-pixeldissolve .px-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.5) 100%); }
  .effect-pixeldissolve.no-text .px-meta { display: none !important; }

  /* 纵深穿梭：照片从深处飞来掠过 + 光轨 */
  .effect-depthtunnel .dt-root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at center, #0b0e14 0%, #000 75%); }
  .effect-depthtunnel .dt-streaks {
    position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.028) 0deg 0.6deg, transparent 0.6deg 9deg);
    animation: dt-spin 90s linear infinite; pointer-events: none;
  }
  @keyframes dt-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .effect-depthtunnel .dt-flyer {
    position: absolute; left: 50%; top: 50%;
    width: min(72vw, 1280px); height: min(72vh, 760px);
    margin-left: calc(min(72vw, 1280px) / -2); margin-top: calc(min(72vh, 760px) / -2);
    animation-name: dt-fly; animation-timing-function: cubic-bezier(0.32, 0.42, 0.55, 1);
    animation-fill-mode: forwards; will-change: transform, opacity;
  }
  /* 螺旋飞出：绕 2 圈、轨道半径收缩；旋转截止点放大，放大时压最上层 */
  @keyframes dt-fly {
    /* 时间配比：旋转 30%、正向放大 60%（旋转的 2 倍）、淡出 10% */
    0% { transform: scale(0.06) rotate(0deg) translate(16vw, -12vh); opacity: 0; }
    4% { opacity: 1; }
    13% { transform: scale(0.30) rotate(230deg) translate(-9vw, 6vh); }
    21% { transform: scale(0.55) rotate(470deg) translate(5vw, 3.5vh); }
    26% { transform: scale(0.82) rotate(650deg) translate(-2vw, -1.5vh); }
    30% { transform: scale(1) rotate(720deg) translate(0, 0); }
    90% { transform: scale(1.15) rotate(720deg) translate(0, 0); opacity: 1; }
    100% { transform: scale(1.2) rotate(720deg) translate(var(--dx), var(--dy)); opacity: 0; }
  }
  /* 主图保持原始比例：contain，不裁切不拉伸 */
  .effect-depthtunnel .dt-flyer img:not(.dt-logo) { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
  .effect-depthtunnel .dt-logo { position: absolute; inset: 0; margin: auto; max-width: 60%; max-height: 45%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 6px 24px rgba(0,0,0,.7)); pointer-events: none; }
  .effect-depthtunnel .dt-logo.logo-wide { inset: auto; margin: 0; left: 50%; bottom: 7%; transform: translateX(-50%); }
  /* 备选小图：散布在黑色深处，缓慢乱序漂移 + 热身动画 */
  .effect-depthtunnel .dt-thumbs {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }
  .effect-depthtunnel .dt-thumb {
    position: absolute; overflow: hidden;
    background: #111;
    border: 1px solid rgba(255,255,255,0.10);
    animation-name: dt-drift; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate;
    will-change: transform;
  }
  @keyframes dt-drift {
    0% { transform: translate(0, 0); }
    50% { transform: translate(26px, -18px); }
    100% { transform: translate(-20px, 22px); }
  }
  .effect-depthtunnel .dt-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .effect-depthtunnel .dt-thumb.warm {
    animation: dt-warm 1.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    opacity: 1 !important; filter: none !important;
    border-color: rgba(255,255,255,0.65); z-index: 5;
  }
  @keyframes dt-warm {
    0% { transform: translateX(0) rotate(0deg) scale(1); }
    8% { transform: translateX(-5px) rotate(0deg) scale(1.08); }
    16% { transform: translateX(5px) rotate(0deg) scale(1.1); }
    24% { transform: translateX(-4px) rotate(0deg) scale(1.12); }
    32% { transform: translateX(3px) rotate(0deg) scale(1.15); }
    45% { transform: translateX(0) rotate(260deg) scale(1.2); }
    70% { transform: translateX(0) rotate(540deg) scale(1.25); }
    100% { transform: translateX(0) rotate(720deg) scale(1.3); }
  }
  .effect-depthtunnel .dt-meta { position: absolute; left: 48px; bottom: 42px; max-width: 560px; color: #fff; z-index: 60; }
  .effect-depthtunnel .dt-title { font-size: 42px; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .effect-depthtunnel .dt-sub { font-size: 15px; opacity: .8; margin-top: 6px; }
  .effect-depthtunnel .dt-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 50; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%); }
  .effect-depthtunnel.no-text .dt-meta { display: none !important; }

  /* 切片翻页：竖条错峰 3D 翻转（编织感） */
  .effect-sliceflip .sf-root { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .effect-sliceflip .sf-stage { position: absolute; inset: 0; perspective: 1600px; }
  .effect-sliceflip .sf-slice { position: absolute; top: 0; bottom: 0; perspective: 1600px; }
  .effect-sliceflip .sf-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1s cubic-bezier(0.4, 0.05, 0.2, 1); }
  .effect-sliceflip .sf-inner.flipped { transform: rotateX(180deg); }
  .effect-sliceflip .sf-face { position: absolute; inset: 0; backface-visibility: hidden; background-color: #000; background-repeat: no-repeat; }
  .effect-sliceflip .sf-back { transform: rotateX(180deg); }
  .effect-sliceflip .sf-logo { position: absolute; inset: 0; margin: auto; max-width: 80%; max-height: 40%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.65)); pointer-events: none; }
  .effect-sliceflip .sf-logo.logo-wide { inset: auto; margin: 0; left: 50%; bottom: 8%; transform: translateX(-50%); }
  .effect-sliceflip .sf-meta { position: absolute; left: 48px; bottom: 42px; max-width: 560px; color: #fff; z-index: 3; }
  .effect-sliceflip .sf-title { font-size: 42px; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .effect-sliceflip .sf-sub { font-size: 15px; opacity: .8; margin-top: 6px; }
  .effect-sliceflip .sf-overview { font-size: 14px; opacity: .85; margin-top: 10px; line-height: 1.6; }
  .effect-sliceflip .sf-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.5) 100%); }
  .effect-sliceflip.no-text .sf-meta { display: none !important; }

  /* 折纸（对齐 macOS Origami：官方预览逐帧校准——全屏铺满、深色底、折痕明暗） */
  .effect-origami .origami-stage { position: absolute; inset: 0; background: #000; }
  .effect-origami .origami-paper {
    position: absolute; inset: 0;
    display: flex; perspective: 1800px;
  }
  .effect-origami .origami-panel {
    flex: 1; position: relative; background-repeat: no-repeat;
    animation: origami-breathe 7s ease-in-out infinite alternate;
  }
  .effect-origami .origami-paper.col { flex-direction: column; }
  .effect-origami .origami-paper.col .origami-panel { animation-name: origami-breathe-x; }
  @keyframes origami-breathe {
    from { transform: rotate3d(0, 1, 0, calc(var(--dir) * var(--ang))); }
    to   { transform: rotate3d(0, 1, 0, calc(var(--dir) * var(--ang) * 0.2)); }
  }
  @keyframes origami-breathe-x {
    from { transform: rotate3d(1, 0, 0, calc(var(--dir) * var(--ang))); }
    to   { transform: rotate3d(1, 0, 0, calc(var(--dir) * var(--ang) * 0.2)); }
  }
  .effect-origami .origami-shade { position: absolute; inset: 0; pointer-events: none; }
  .effect-origami .shade-left   { background: linear-gradient(to right,  rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.12) 18%, transparent 40%); }
  .effect-origami .shade-right  { background: linear-gradient(to left,   rgba(0,0,0,0.30) 0%, rgba(255,255,255,0.10) 18%, transparent 40%); }
  .effect-origami .shade-top    { background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.12) 18%, transparent 40%); }
  .effect-origami .shade-bottom { background: linear-gradient(to top,    rgba(0,0,0,0.30) 0%, rgba(255,255,255,0.10) 18%, transparent 40%); }
  .effect-origami .origami-meta { position: absolute; left: 60px; bottom: 56px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.85); }
  .effect-origami .origami-title { font-size: 44px; font-weight: 700; }
  .effect-origami .origami-sub { font-size: 17px; opacity: .85; margin-top: 8px; letter-spacing: 2px; }
  .effect-origami .origami-overview { font-size: 14px; opacity: .8; max-width: 600px; line-height: 1.6; margin-top: 10px; }
  .effect-origami.no-text .origami-meta { display: none !important; }

  /* 不断变化的拼贴（对齐 macOS Shifting Tiles 真实行为：变宽模块 + 收缩/补位/滑入） */
  .effect-shiftingtiles .collage-root { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; overflow: hidden; }
  .effect-shiftingtiles .collage-row { flex: 1; display: flex; min-height: 0; }
  .effect-shiftingtiles .ctile {
    flex: 0 0 auto; min-width: 0;
    position: relative;
    padding: 3px;              /* 6px 均匀黑色间隔 */
    box-sizing: border-box; overflow: hidden;
    transition: flex-basis 1100ms cubic-bezier(0.45, 0, 0.2, 1);
  }
  .effect-shiftingtiles .ctile > img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .effect-shiftingtiles .ctile-half { height: calc(50% - 3px); }
  .effect-shiftingtiles .ctile-half:first-child { margin-bottom: 6px; }
  .effect-shiftingtiles .ctile-half img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

  /* 滑动面板（对齐 macOS Sliding Panels：抽屉式整组交错滑出/滑入，非连续滚动） */
  .effect-slidingpanels .panels-root { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
  .effect-slidingpanels .panel-col {
    flex: none; height: 100vh; overflow: hidden; position: relative;
    transition: transform 0.75s cubic-bezier(.65,.02,.3,1);
  }
  .effect-slidingpanels .panel-col img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .effect-slidingpanels .panel-col.dir-up.exiting   { transform: translateY(-100%); }
  .effect-slidingpanels .panel-col.dir-down.exiting { transform: translateY(100%); }
  .effect-slidingpanels .panel-col.dir-up.entering   { animation: panels-in-from-down 0.75s cubic-bezier(.65,.02,.3,1); }
  .effect-slidingpanels .panel-col.dir-down.entering { animation: panels-in-from-up 0.75s cubic-bezier(.65,.02,.3,1); }
  @keyframes panels-in-from-down { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes panels-in-from-up   { from { transform: translateY(-100%); } to { transform: translateY(0); } }
  /* 每个面板底部剧名条：所有面板统一字号 */
  .effect-slidingpanels .panel-cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 40px 18px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.72));
    color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .effect-slidingpanels .cap-title { font-size: 32px; font-weight: 700; line-height: 1.25; }
  .effect-slidingpanels .cap-logo { max-width: 85%; max-height: 64px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 4px 12px rgba(0,0,0,.65)); }
  .effect-slidingpanels.no-text .panel-cap { display: none !important; }

  .placeholder { width: 100vw; height: 100vh; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .error { color: #f87171; padding: 24px; max-width: 480px; text-align: center; line-height: 1.6; }
  .placeholder.waiting { color: #f87171; font-weight: 600; font-size: 18px; animation: fspw-blink 0.9s step-start infinite; }
  @keyframes fspw-blink { 50% { opacity: 0.15; } }
</style>
</head>
<body>
<div id="app">
  <div class="placeholder" id="placeholder">正在加载海报...</div>
</div>

<script>
(async function() {
  const API = '/api/v1/plugin/FullScreenPosterWall/public-data';

  function pickUrl(item, imageType, domain) {
    const c = pickUrlCandidates(item, imageType, domain);
    return c[0] || '';
  }

  // 按优先级返回某条目的全部候选图 URL（去重）。
  // 预加载失败时在同一条目内逐级回退：Fanart CDN（assets.fanart.tv）
  // 在浏览器侧不可达时自动降级 TMDB，而不是整条跳过导致整面墙黑屏。
  function pickUrlCandidates(item, imageType, domain) {
    if (!item) return [];
    let paths;
    if (imageType === 'poster') paths = [item.poster_path, item.backdrop_path];
    else if (imageType === 'logo') paths = [item.thumb_path, item.fanart_poster_path, item.backdrop_path, item.poster_path];
    else paths = [item.backdrop_path, item.poster_path];
    const base = domain || 'https://image.tmdb.org/t/p/original';
    const urls = paths.filter(Boolean).map(p => {
      if (/^https?:/.test(p)) return p;
      if (p.startsWith('/')) return base + p;
      return base + '/' + p;
    });
    return [...new Set(urls)];
  }

  // 死主机记忆：同一主机连续失败 2 次即标记，后续候选直接跳过（页面会话内有效）。
  // 解决 Fanart CDN 不可达时每张图都白等网络层超时、整面墙黑屏 ~30 秒的问题。
  const hostFailCount = new Map();
  const deadHosts = new Set();
  function hostOf(url) { try { return new URL(url).host; } catch (e) { return ''; } }
  function noteHostFail(url) {
    const h = hostOf(url);
    if (!h) return;
    const n = (hostFailCount.get(h) || 0) + 1;
    hostFailCount.set(h, n);
    if (n >= 2) deadHosts.add(h);
  }

  // 按优先级加载候选图：死主机跳过、单候选 timeoutMs 超时快速失败
  function tryLoadCandidates(urls, timeoutMs) {
    timeoutMs = timeoutMs || 1500;
    const live = urls.filter(u => !deadHosts.has(hostOf(u)));
    const list = live.length ? live : urls.slice();
    return new Promise(resolve => {
      const tryAt = i => {
        if (i >= list.length) return resolve('');
        const url = list[i];
        let settled = false;
        const img = new Image();
        const fail = () => {
          if (settled) return;
          settled = true; clearTimeout(timer); img.src = '';
          noteHostFail(url); tryAt(i + 1);
        };
        const timer = setTimeout(fail, timeoutMs);
        img.onload = () => { if (settled) return; settled = true; clearTimeout(timer); resolve(url); };
        img.onerror = fail;
        img.src = url;
      };
      tryAt(0);
    });
  }
  function hasNativeLogo(item) { return !!(item && (item.thumb_path || item.fanart_poster_path)); }
  function logoUrl(item, domain) {
    if (!item || !item.logo_path) return '';
    const path = item.logo_path;
    if (/^https?:/.test(path)) return path;
    if (path.startsWith('/')) return (domain || 'https://image.tmdb.org/t/p/original') + path;
    return (domain || 'https://image.tmdb.org/t/p/original') + '/' + path;
  }
  function trimOverview(s, max) { max = max || 160; if (!s) return ''; return s.length > max ? s.slice(0, max) + '…' : s; }
  function shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  function setTopBar(cfg, items) {
    const tb = document.createElement('div');
    tb.className = 'topbar';
    const effectName = ({photos:'照片',floating:'浮动',vintage:'怀旧冲印',lightdance:'光舞',shiftingtiles:'流动拼贴',slidingpanels:'滑动面板',ring3d:'环形画廊',depthtunnel:'纵深穿梭'})[cfg.effect] || cfg.effect;
    tb.innerHTML = '<div class="pill"><span class="dot"></span>' + effectName + ' · 每 ' + cfg.interval + ' 秒</div>' +
                   '<div class="pill">' + items.length + ' 张</div>' +
                   (cfg.shuffle ? '<div class="pill">随机乱序</div>' : '') +
                   (cfg.hide_text ? '<div class="pill">去文字</div>' : '');
    document.body.appendChild(tb);
  }

  async function load() {
    const resp = await fetch(API, { credentials: 'omit' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const cfg = data.config || {};
    let items = data.items || [];
    if (cfg.shuffle) items = shuffle(items);
    return { cfg, items };
  }

  function clearApp() { const app = document.getElementById('app'); app.innerHTML = ''; return app; }

  function renderPhotos(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-photos' + (cfg.hide_text ? ' no-text' : '');
    let idx = 0;
    let timer;
    function show() {
      const it = items[idx]; if (!it) return;
      const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
      root.innerHTML = '<div class="photo-frame"><img src="' + escapeHtml(url) + '" class="photo-img" alt="" />' +
        (cfg.hide_text ? '' :
        '<div class="photo-overlay"><div class="photo-meta">' +
        ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<h1>' + escapeHtml(it.title) + '</h1>') +
        ((it.year || it.type) ? '<div class="photo-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="photo-overview">' + escapeHtml(trimOverview(it.overview)) + '</div>' : '') +
        '</div></div>') +
        '</div>';
    }
    function next() { idx = (idx + 1) % items.length; show(); }
    show();
    timer = setInterval(next, Math.max(2000, cfg.interval * 1000));
    app.appendChild(root);
  }

  function renderFloating(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-floating' + (cfg.hide_text ? ' no-text' : '');
    const inner = document.createElement('div');
    inner.className = 'float-root';
    root.appendChild(inner);
    app.appendChild(root);
    let cursor = 0, lastSwap = 0, lastSpawn = 0, raf;
    const MAX = 16;
    const cards = [];
    function spawn() {
      if (!items.length) return null;
      if (cursor >= items.length) cursor = 0;   // 队列耗尽后循环复用，保证持续轮播
      const it = items[cursor++];
      const w = inner.clientWidth, h = inner.clientHeight;
      const size = 240 + Math.random() * 300;
      const speed = 0.15 + Math.random() * 0.4;
      const angle = Math.random() * Math.PI * 2;
      const card = document.createElement('div');
      card.className = 'float-card';
      const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
      card.innerHTML = '<img src="' + escapeHtml(url) + '" alt="" />' +
        (cfg.hide_text ? '' : ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<div class="float-caption"><img class="meta-logo" style="max-width:200px;max-height:56px" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" /></div>' : '<div class="float-caption"><div class="float-caption-title">' + escapeHtml(it.title) + '</div>') +
        (it.overview ? '<div class="float-caption-overview">' + escapeHtml(trimOverview(it.overview, 70)) + '</div>' : '') +
        '</div>');
      card.style.width = size + 'px';
      card.style.height = (size * 1.5) + 'px';
      const obj = { el: card, item: it, x: Math.random() * (w - size), y: Math.random() * (h - size), vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size, rot: 0, fade: 0 };
      inner.appendChild(card);
      cards.push(obj);
      return obj;
    }
    function step(now) {
      const w = inner.clientWidth, h = inner.clientHeight;
      if (now - lastSwap > cfg.interval * 1000) {
        if (cards.length) {
          const oldest = cards.reduce((a, b) => (a.fade > b.fade ? b : a));
          const fresh = spawn();
          if (fresh) { oldest.el.remove(); cards.splice(cards.indexOf(oldest), 1, fresh); }
        }
        lastSwap = now;
      }
      if (cards.length < MAX && now - lastSpawn > 800) { spawn(); lastSpawn = now; }
      for (const m of cards) {
        m.x += m.vx; m.y += m.vy;
        if (m.x < -m.size * 0.3) { m.x = -m.size * 0.3; m.vx = Math.abs(m.vx); }
        if (m.x > w - m.size * 0.7) { m.x = w - m.size * 0.7; m.vx = -Math.abs(m.vx); }
        if (m.y < -m.size * 0.3) { m.y = -m.size * 0.3; m.vy = Math.abs(m.vy); }
        if (m.y > h - m.size * 0.5) { m.y = h - m.size * 0.5; m.vy = -Math.abs(m.vy); }
        m.fade = Math.min(1, m.fade + 0.02);
        m.rot += Math.sin((now / 1000 + m.x) * 0.0003) * 0.02;
        m.el.style.transform = 'translate(' + m.x + 'px, ' + m.y + 'px) rotate(' + m.rot + 'deg)';
        m.el.style.opacity = String(m.fade);
      }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  function renderVintage(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-vintage' + (cfg.hide_text ? ' no-text' : '');
    let idx = 0, timer;
    function show() {
      const it = items[idx]; if (!it) return;
      const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
      root.innerHTML = '<img src="' + escapeHtml(url) + '" class="vintage-img" alt="" />' +
        '<canvas class="grain"></canvas>' +
        '<div class="vintage-vignette"></div>' +
        (cfg.hide_text ? '' :
        '<div class="vintage-meta">' +
        ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="vintage-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="vintage-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="vintage-overview">' + escapeHtml(trimOverview(it.overview, 120)) + '</div>' : '') +
        '</div>');
      const c = root.querySelector('canvas');
      if (c) {
        const ctx = c.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        const img = ctx.createImageData(c.clientWidth, c.clientHeight);
        for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
        ctx.putImageData(img, 0, 0);
      }
    }
    function next() { idx = (idx + 1) % items.length; show(); }
    show();
    timer = setInterval(next, Math.max(2500, cfg.interval * 1000));
    app.appendChild(root);
  }

  function renderLightDance(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-lightdance' + (cfg.hide_text ? ' no-text' : '');
    let idx = 0, timer;
    function show() {
      const it = items[idx]; if (!it) return;
      const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
      let orbs = '';
      for (let i = 0; i < 12; i++) {
        const sz = 200 + Math.random() * 280;
        const hue = Math.floor(Math.random() * 360);
        orbs += '<div class="light-orb" style="width:' + sz + 'px;height:' + sz + 'px;left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;background:radial-gradient(circle, hsla(' + hue + ',90%,70%,0.7), hsla(' + hue + ',90%,50%,0) 70%)"></div>';
      }
      root.innerHTML = '<img src="' + escapeHtml(url) + '" class="light-img" alt="" />' +
        '<div class="light-conic"></div>' + orbs +
        (cfg.hide_text ? '' :
        '<div class="light-meta">' +
        ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="light-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="light-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="light-overview">' + escapeHtml(trimOverview(it.overview, 120)) + '</div>' : '') +
        '</div>');
    }
    function next() { idx = (idx + 1) % items.length; show(); }
    show();
    timer = setInterval(next, Math.max(3000, cfg.interval * 1000));
    app.appendChild(root);
  }

  function renderOrigami(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-origami' + (cfg.hide_text ? ' no-text' : '');
    // Apple Origami 样式里的折痕模式（layoutTags）
    const PATTERNS = [
      { axis: 'x', creases: [0.5] },
      { axis: 'y', creases: [0.5] },
      { axis: 'x', creases: [0.33, 0.67] },
      { axis: 'y', creases: [0.33, 0.67] },
      { axis: 'x', creases: [0.25, 0.75] },
      { axis: 'y', creases: [0.25, 0.75] },
    ];
    let idx = 0, timer;
    function show() {
      const it = items[idx]; if (!it) return;
      const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
      const pat = PATTERNS[idx % PATTERNS.length];
      const n = pat.creases.length + 1;
      let html = '<div class="origami-stage"><div class="origami-paper' + (pat.axis === 'y' ? ' col' : '') + '">';
      for (let i = 0; i < n; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        const ang = Math.max(7, 14 - i * 2.5);
        const bgSize = pat.axis === 'x' ? (n * 100) + '% 100%' : '100% ' + (n * 100) + '%';
        const bgPos = pat.axis === 'x'
          ? (n === 1 ? 'center' : (i / (n - 1) * 100) + '% center')
          : (n === 1 ? 'center' : 'center ' + (i / (n - 1) * 100) + '%');
        const origin = pat.axis === 'x' ? 'left center' : 'center top';
        const shade = pat.axis === 'x'
          ? (dir > 0 ? 'shade-left' : 'shade-right')
          : (dir > 0 ? 'shade-top' : 'shade-bottom');
        html += '<div class="origami-panel" style="' +
          'background-image:url(' + escapeHtml(url) + ');' +
          'background-size:' + bgSize + ';' +
          'background-position:' + bgPos + ';' +
          'transform-origin:' + origin + ';' +
          '--dir:' + dir + ';--ang:' + ang + 'deg;' +
          'animation-delay:' + (i * 0.4) + 's">' +
          '<div class="origami-shade ' + shade + '"></div></div>';
      }
      html += '</div>' +
        (cfg.hide_text ? '' :
        '<div class="origami-meta">' +
        ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="origami-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="origami-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="origami-overview">' + escapeHtml(trimOverview(it.overview, 110)) + '</div>' : '') +
        '</div>') +
        '</div>';
      root.innerHTML = html;
    }
    function next() { idx = (idx + 1) % items.length; show(); }
    show();
    timer = setInterval(next, Math.max(4000, cfg.interval * 1000));
    app.appendChild(root);
  }

  function renderShiftingTiles(app, cfg, items) {
    // 对齐 macOS Shifting Tiles 真实行为：不同宽度模块铺满全屏，
    // 每隔 3~5s 随机一个模块收缩退出、邻居补位、新模块展开滑入
    const root = document.createElement('div');
    root.className = 'effect-shiftingtiles' + (cfg.hide_text ? ' no-text' : '');
    const collage = document.createElement('div');
    collage.className = 'collage-root';
    root.appendChild(collage);

    const ANIM_MS = 1100, STACKED_PROB = 0.25;
    let queue = [], cursor = 0, busy = false, timer = null;

    function reshuffle() {
      queue = [...items];
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      cursor = 0;
    }
    function nextPhoto() {
      return new Promise(async resolve => {
        let guard = 0;
        while (guard++ <= items.length) {
          if (cursor >= queue.length) reshuffle();
          const it = queue[cursor++];
          const cands = it ? pickUrlCandidates(it, cfg.image_type, cfg.tmdb_image_domain) : [];
          if (!cands.length) continue;
          const url = await tryLoadCandidates(cands);
          if (!url) continue;
          return resolve({ url, logo: (it && !hasNativeLogo(it)) ? logoUrl(it, cfg.tmdb_image_domain) : '' });
        }
        resolve({ url: '', logo: '' });
      });
    }
    function genWidth() {
      const r = Math.random();
      if (r < 0.25) return 0.30 + Math.random() * 0.08;
      if (r < 0.75) return 0.20 + Math.random() * 0.08;
      return 0.14 + Math.random() * 0.06;
    }
    async function makeTileEl(w) {
      const el = document.createElement('div');
      el.className = 'ctile';
      el.style.flexBasis = (w * 100).toFixed(3) + '%';
      el._w = w;
      if (Math.random() < STACKED_PROB) {
        const p1 = await nextPhoto(), p2 = await nextPhoto();
        el.innerHTML =
          '<div class="ctile-half"><img src="' + escapeHtml(p1.url) + '" alt="" /></div>' +
          '<div class="ctile-half"><img src="' + escapeHtml(p2.url) + '" alt="" /></div>';
        el._logo = p1.logo;
      } else {
        const p = await nextPhoto();
        el.innerHTML = '<img src="' + escapeHtml(p.url) + '" alt="" />';
        el._logo = p.logo;
      }
      if (cfg.image_type === 'logo' && el._logo) {
        el.innerHTML += '<img class="ctile-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(el._logo) + '" alt="" />';
      }
      return el;
    }
    async function makeRow(count) {
      const rowEl = document.createElement('div');
      rowEl.className = 'collage-row';
      const ws = Array.from({ length: count }, genWidth);
      const sum = ws.reduce((a, b) => a + b, 0);
      // 并行构建瓷砖：某块图慢不拖垮整行（首屏速度关键）
      const els = await Promise.all(ws.map(w => makeTileEl(w / sum)));
      for (const el of els) rowEl.appendChild(el);
      return rowEl;
    }
    async function build() {
      reshuffle();
      collage.innerHTML = '';
      const portrait = window.innerWidth < window.innerHeight;
      const counts = portrait ? [3, 3, 3] : [3 + Math.floor(Math.random() * 3), 3 + Math.floor(Math.random() * 3)];
      const rows = await Promise.all(counts.map(c => makeRow(c)));
      for (const r of rows) collage.appendChild(r);
    }
    function shiftOnce() {
      if (busy) return;
      const rows = collage.querySelectorAll('.collage-row');
      if (!rows.length) return;
      busy = true;
      const rowEl = rows[Math.floor(Math.random() * rows.length)];
      const tiles = [...rowEl.children];
      if (tiles.length < 3) { busy = false; return; }
      const ti = Math.floor(Math.random() * tiles.length);
      const victim = tiles[ti];
      const neighbor = tiles[ti > 0 ? ti - 1 : ti + 1];
      // 1) 旧模块收缩，邻居补位
      const freed = victim._w;
      victim._w = 0;
      victim.style.flexBasis = '0%';
      neighbor._w += freed;
      neighbor.style.flexBasis = (neighbor._w * 100).toFixed(3) + '%';
      // 2) 收缩过半后移除旧模块，插入 0 宽新模块并展开
      setTimeout(async () => {
        victim.remove();
        const t = await makeTileEl(0);
        const kids = [...rowEl.children];
        const pos = Math.floor(Math.random() * (kids.length + 1));
        if (pos >= kids.length) rowEl.appendChild(t); else rowEl.insertBefore(t, kids[pos]);
        requestAnimationFrame(() => {
          const w = genWidth();
          const others = [...rowEl.children].filter(x => x !== t);
          const sum = others.reduce((a, b) => a + b._w, 0) || 1;
          others.forEach(x => {
            x._w = x._w / sum * (1 - w);
            x.style.flexBasis = (x._w * 100).toFixed(3) + '%';
          });
          t._w = w;
          t.style.flexBasis = (w * 100).toFixed(3) + '%';
          setTimeout(() => { busy = false; }, ANIM_MS);
        });
      }, ANIM_MS * 0.55);
    }
    function schedule() {
      if (timer) { clearTimeout(timer); timer = null; }
      const base = Math.min(5000, Math.max(3000, cfg.interval * 1000));
      const wait = base - 1000 + Math.random() * 2000;
      timer = setTimeout(() => { shiftOnce(); schedule(); }, wait);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearTimeout(timer); timer = null; }
      else if (!document.hidden) schedule();
    });
    build().then(schedule);
    app.appendChild(root);
  }

  function renderPinPinTie(app, cfg, items) {
    // 拼拼贴：上下两条横向轨道，新板从边缘撞入推挤同轨道面板链
    const root = document.createElement('div');
    root.className = 'effect-pinpintie' + (cfg.hide_text ? ' no-text' : '') + (cfg.image_type === 'logo' ? ' fit-logo' : '');
    const stage = document.createElement('div');
    stage.className = 'ppt-root';
    root.appendChild(stage);

    const HOLD_BLACK = 500, ENTER_STAGGER = 90, ENTER_TRAVEL = 700;
    const WAVE_STEP = 35, COMPRESS = 0.96, PUSH_MS = 550, SETTLE_MS = 400, VERTICAL_PROB = 0.2;
    const EASE_PUSH = 'cubic-bezier(0.42, 0, 0.18, 1)';
    const EASE_ENTER = 'cubic-bezier(0.16, 0.84, 0.24, 1)';
    const EASE_SETTLE = 'cubic-bezier(0.22, 0.68, 0.28, 1.12)';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let tracks = [], queue = [], cursor = 0, busy = false, timer = null, uid = 0;
    let lastTrack = 0, sameTrackRun = 0, lastDir = 1, sameDirRun = 0;

    function reshuffle() {
      queue = [...items];
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      cursor = 0;
    }
    function nextPhoto() {
      return new Promise(resolve => {
        if (!items.length) return resolve({ url: '', logo: '' });
        let guard = 0;
        const tryNext = () => {
          if (cursor >= queue.length) reshuffle();
          const it = queue[cursor++];
          const url = it ? pickUrl(it, cfg.image_type, cfg.tmdb_image_domain) : '';
          if (!url || ++guard > items.length) return resolve({ url: '', logo: '' });
          const img = new Image();
          img.onload = async () => {
            try { await img.decode(); } catch (e) {}
            resolve({ url, logo: (it && !hasNativeLogo(it)) ? logoUrl(it, cfg.tmdb_image_domain) : '' });
          };
          img.onerror = () => tryNext();
          img.src = url;
        };
        tryNext();
      });
    }
    function genF() {
      const r = Math.random();
      if (r < 0.22) return 0.65;
      if (r < 0.62) return 1.0;
      if (r < 0.90) return 1.55;
      return 2.2;
    }
    function normalize(tiles) {
      const sum = tiles.reduce((a, t) => a + t.f, 0) || 1;
      tiles.forEach(t => { t.f = t.f / sum; });
    }
    function setAnim(t, dur, ease, delay) { t.dur = dur; t.ease = ease; t.delay = delay; }

    function layout(track) {
      let x = 0;
      track.tiles.forEach(t => {
        const left = t.exitX !== undefined ? t.exitX : x * 100;
        x += t.f;
        const el = t.el;
        el.style.left = left.toFixed(3) + '%';
        el.style.width = (t.f * 100).toFixed(3) + '%';
        el.style.transform = t.pre
          ? 'translate3d(-108%, 0, 0)'
          : 'translate3d(' + (t.offX * 100) + '%, ' + (t.offY * 112) + '%, 0)';
        el.style.transition = t.dur
          ? 'left ' + t.dur + 'ms ' + t.ease + ' ' + t.delay + 'ms, width ' + t.dur + 'ms ' + t.ease + ' ' + t.delay + 'ms, transform ' + t.dur + 'ms ' + t.ease + ' ' + t.delay + 'ms'
          : 'none';
        el.style.zIndex = (t.offX || t.offY || t.pre) ? 2 : 1;
      });
    }
    function layoutAll() { tracks.forEach(layout); }

    async function makeTile(f) {
      const p = await nextPhoto();
      const el = document.createElement('div');
      el.className = 'ppt-tile';
      let html = p.url ? '<img src="' + escapeHtml(p.url) + '" alt="" draggable="false" />' : '';
      if (cfg.image_type === 'logo' && p.logo) {
        html += '<img class="ppt-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(p.logo) + '" alt="" />';
      }
      el.innerHTML = html;
      return { id: ++uid, f, el, pre: false, offX: 0, offY: 0, exitX: undefined, delay: 0, dur: 0, ease: EASE_PUSH };
    }
    async function makeTrack(count) {
      const el = document.createElement('div');
      el.className = 'ppt-track';
      const track = { el, tiles: [] };
      for (let i = 0; i < count; i++) {
        const t = await makeTile(genF());
        track.tiles.push(t);
        el.appendChild(t.el);
      }
      normalize(track.tiles);
      return track;
    }

    // 首屏：全黑 → 从左向右碰撞式填充
    async function build() {
      reshuffle();
      stage.innerHTML = '';
      const portrait = window.innerWidth < window.innerHeight;
      const nTracks = portrait ? 3 : 2;
      const perTrack = portrait ? 4 : 4 + Math.floor(Math.random() * 3);
      tracks = [];
      for (let i = 0; i < nTracks; i++) {
        const tr = await makeTrack(perTrack + (i % 2));
        tracks.push(tr);
        stage.appendChild(tr.el);
      }
      tracks.forEach(tr => tr.tiles.forEach(t => { t.f *= COMPRESS; t.pre = true; }));
      layoutAll();
      tracks.forEach((tr, ti) => {
        setTimeout(() => {
          tr.tiles.forEach((t, i) => { setAnim(t, ENTER_TRAVEL, EASE_ENTER, i * ENTER_STAGGER); t.pre = false; });
          layout(tr);
          setTimeout(() => {
            normalize(tr.tiles);
            tr.tiles.forEach((t, i) => setAnim(t, 280, reduceMotion ? EASE_PUSH : EASE_SETTLE, i * 20));
            layout(tr);
            setTimeout(() => { tr.tiles.forEach(t => { t.dur = 0; t.delay = 0; }); layout(tr); }, 400);
          }, ENTER_TRAVEL + tr.tiles.length * ENTER_STAGGER);
        }, HOLD_BLACK + ti * 150);
      });
    }

    // 模式 A：边缘推入
    async function modePush(tr, dir) {
      const tiles = tr.tiles;
      const victim = dir === 1 ? tiles[tiles.length - 1] : tiles[0];
      const p = await nextPhoto();
      const estN = tiles.length + 1;
      const w = genF();
      const nt = await makeTile(w / (estN - 1 + w));
      nt.offX = dir === 1 ? -1.08 : 1.08;
      if (dir === 1) { tiles.unshift(nt); tr.el.prepend(nt.el); } else { tiles.push(nt); tr.el.appendChild(nt.el); }
      tiles.forEach(t => { if (t !== nt) t.f *= COMPRESS; });
      tiles.forEach((t, i) => {
        const rank = dir === 1 ? i : tiles.length - 1 - i;
        setAnim(t, PUSH_MS, t === nt ? EASE_ENTER : EASE_PUSH, rank * WAVE_STEP);
      });
      nt.offX = 0;
      layout(tr);
      setTimeout(() => {
        const rest = tiles.filter(t => t !== victim);
        normalize(rest);
        victim.exitX = dir === 1 ? 100 : -victim.f * 100;
        tiles.forEach((t, i) => {
          const rank = dir === 1 ? i : tiles.length - 1 - i;
          setAnim(t, SETTLE_MS, reduceMotion ? EASE_PUSH : EASE_SETTLE, rank * (WAVE_STEP * 0.6));
        });
        layout(tr);
        setTimeout(() => {
          const idx = tr.tiles.indexOf(victim);
          if (idx >= 0) { tr.tiles.splice(idx, 1); victim.el.remove(); }
          tr.tiles.forEach(t => { t.dur = 0; t.delay = 0; });
          layout(tr);
        }, SETTLE_MS + tiles.length * WAVE_STEP * 0.6 + 80);
      }, PUSH_MS + 120);
    }

    // 模式 B：边缘宽板压缩替换
    async function modeCompress(tr, dir) {
      const tiles = tr.tiles;
      const edgeTiles = dir === 1 ? tiles.slice(0, 2) : tiles.slice(-2);
      const victim = edgeTiles.reduce((a, b) => (a.f > b.f ? a : b));
      const freed = victim.f;
      tiles.forEach(t => setAnim(t, 500, EASE_PUSH, 0));
      victim.f = 0;
      layout(tr);
      setTimeout(async () => {
        const idx = tr.tiles.indexOf(victim);
        if (idx >= 0) { tr.tiles.splice(idx, 1); victim.el.remove(); }
        const parts = freed > 0.30 ? 2 : 1;
        for (let i = 0; i < parts; i++) {
          const nt = await makeTile(0.0001);
          if (dir === 1) { tr.tiles.splice(i, 0, nt); tr.el.prepend(nt.el); }
          else { tr.tiles.push(nt); tr.el.appendChild(nt.el); }
        }
        layout(tr);
        setTimeout(() => {
          normalize(tr.tiles);
          tr.tiles.forEach((t, i) => {
            const rank = dir === 1 ? i : tr.tiles.length - 1 - i;
            setAnim(t, 700, reduceMotion ? EASE_PUSH : EASE_SETTLE, rank * WAVE_STEP);
          });
          layout(tr);
          setTimeout(() => { tr.tiles.forEach(t => { t.dur = 0; t.delay = 0; }); layout(tr); }, 900);
        }, 60);
      }, 560);
    }

    // 模式 C：垂直抽离后补位
    async function modeVertical(tr) {
      const tiles = tr.tiles;
      const i = Math.floor(Math.random() * tiles.length);
      const victim = tiles[i];
      const up = Math.random() < 0.5;
      setAnim(victim, 420, EASE_PUSH, 0);
      victim.offY = up ? -1 : 1;
      layout(tr);
      setTimeout(async () => {
        const idx = tr.tiles.indexOf(victim);
        if (idx >= 0) { tr.tiles.splice(idx, 1); victim.el.remove(); }
        const nt = await makeTile(victim.f);
        nt.offY = up ? 1 : -1;
        const at = Math.min(i, tr.tiles.length);
        tr.tiles.splice(at, 0, nt);
        const ref = tr.el.children[at] || null;
        tr.el.insertBefore(nt.el, ref);
        layout(tr);
        setTimeout(() => {
          setAnim(nt, 500, reduceMotion ? EASE_PUSH : EASE_SETTLE, 0);
          nt.offY = 0;
          layout(tr);
          setTimeout(() => { nt.dur = 0; nt.delay = 0; layout(tr); }, 560);
        }, 50);
      }, 470);
    }

    function pickTrack() {
      if (tracks.length < 2) return 0;
      if (sameTrackRun > 0 && Math.random() < 0.7) { sameTrackRun--; return lastTrack; }
      const next = lastTrack === 0 ? 1 : 0;
      lastTrack = next;
      sameTrackRun = 2 + Math.floor(Math.random() * 3);
      return next;
    }
    async function shiftOnce() {
      if (busy || !tracks.length) return;
      busy = true;
      try {
        const tr = tracks[pickTrack()];
        if (!tr || tr.tiles.length < 3) return;
        if (!reduceMotion && Math.random() < VERTICAL_PROB) {
          await modeVertical(tr);
        } else {
          if (sameDirRun-- <= 0) { lastDir = -lastDir; sameDirRun = 2 + Math.floor(Math.random() * 3); }
          if (Math.random() < 0.3) await modeCompress(tr, lastDir);
          else await modePush(tr, lastDir);
        }
      } finally {
        setTimeout(() => { busy = false; }, 1200);
      }
    }
    function schedule() {
      if (timer) { clearTimeout(timer); timer = null; }
      const base = Math.min(5600, Math.max(4200, (cfg.interval || 5) * 1000));
      const wait = base - 700 + Math.random() * 1400;
      timer = setTimeout(async () => { await shiftOnce(); schedule(); }, wait);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearTimeout(timer); timer = null; }
      else if (!document.hidden) schedule();
    });
    let rsTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(rsTimer);
      rsTimer = setTimeout(() => {
        const want = (window.innerWidth < window.innerHeight) ? 3 : 2;
        if (tracks.length !== want) build();
      }, 220);
    });
    build().then(() => setTimeout(schedule, 2600));
    app.appendChild(root);
  }

  function renderSlidingPanels(app, cfg, items) {
    const root = document.createElement('div');
    root.className = 'effect-slidingpanels' + (cfg.hide_text ? ' no-text' : '');
    const wrap = document.createElement('div');
    wrap.className = 'panels-root';
    // Apple 官方预览实测：面板宽度不固定，轮换布局
    const LAYOUTS = [
      [0.31, 0.19, 0.10, 0.40],
      [0.25, 0.25, 0.25, 0.25],
      [0.40, 0.20, 0.40],
      [0.20, 0.30, 0.30, 0.20],
    ];
    let layoutIdx = 0;
    let cursor = 0;
    function nextItem() { const it = items[cursor % items.length]; cursor++; return it; }
    const cols = [];
    function build(li) {
      wrap.innerHTML = '';
      cols.length = 0;
      const layout = LAYOUTS[li % LAYOUTS.length];
      layout.forEach((w, i) => {
        const col = document.createElement('div');
        col.className = 'panel-col ' + (i % 2 === 0 ? 'dir-up' : 'dir-down');
        col.style.flexBasis = (w * 100) + '%';
        const img = document.createElement('img');
        const it = nextItem();
        if (it) img.src = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
        col.appendChild(img);
        // 每个面板底部统一字号的剧名条
        if (it && !cfg.hide_text) {
          const cap = document.createElement('div');
          cap.className = 'panel-cap';
          cap.innerHTML = (cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain))
            ? '<img class="cap-logo" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />'
            : '<div class="cap-title">' + escapeHtml(it.title) + '</div>';
          col.appendChild(cap);
        }
        wrap.appendChild(col);
        cols.push({ col, img });
      });
    }
    build(0);
    root.appendChild(wrap);
    let busy = false;
    const SLIDE_MS = 750, STAGGER = 110;
    const timer = setInterval(() => {
      if (busy) return;
      busy = true;
      const n = cols.length;
      cols.forEach((c, i) => setTimeout(() => c.col.classList.add('exiting'), i * STAGGER));
      setTimeout(() => {
        layoutIdx = (layoutIdx + 1) % LAYOUTS.length;
        build(layoutIdx);
        cols.forEach(c => c.col.classList.add('entering'));
        setTimeout(() => {
          cols.forEach(c => c.col.classList.remove('entering'));
          busy = false;
        }, SLIDE_MS + 80);
      }, n * STAGGER + SLIDE_MS);
    }, Math.max(3000, cfg.interval * 1000));
    app.appendChild(root);
  }

  function renderRingGallery(app, cfg, items) {
    // 环形画廊：N 张照片排在 3D 圆柱环上，步进旋转，正面聚焦
    const root = document.createElement('div');
    root.className = 'effect-ring3d' + (cfg.hide_text ? ' no-text' : '');
    const N = 10, step = 360 / N;
    let cursor = 0, rotation = 0, frontIndex = 0, timer = null;
    const radius = Math.round((Math.min(window.innerWidth * 0.50, 730) / 2) / Math.tan(Math.PI / N)) + 40;
    // 背景动效：极光光斑 + 微尘光点
    ['rg-aurora a1', 'rg-aurora a2', 'rg-dust d1', 'rg-dust d2'].forEach(cls => {
      const d = document.createElement('div');
      d.className = cls;
      root.appendChild(d);
    });
    const stage = document.createElement('div');
    stage.className = 'rg-stage';
    const ring = document.createElement('div');
    ring.className = 'rg-ring';
    ring.style.transform = 'translateZ(' + (-radius) + 'px) rotateX(-6deg)';
    stage.appendChild(ring);
    root.appendChild(stage);
    const floor = document.createElement('div'); floor.className = 'rg-floor'; root.appendChild(floor);
    const meta = document.createElement('div'); meta.className = 'rg-meta';
    if (!cfg.hide_text) root.appendChild(meta);
    const vig = document.createElement('div'); vig.className = 'rg-vignette'; root.appendChild(vig);
    const wrap = document.createElement('div'); wrap.className = 'rg-root';
    while (root.firstChild) wrap.appendChild(root.firstChild);
    root.appendChild(wrap);

    const cards = [];
    function cardAt(i) {
      const it = items[(cursor++) % items.length];
      const url = it ? pickUrl(it, cfg.image_type, cfg.tmdb_image_domain) : '';
      const el = document.createElement('div');
      el.className = 'rg-card' + (i === 0 ? ' front' : '');
      el.style.transform = 'rotateY(' + (i * step) + 'deg) translateZ(' + radius + 'px)';
      let html = url ? '<img src="' + escapeHtml(url) + '" alt="" draggable="false" />' : '';
      if (cfg.image_type === 'logo' && it && !hasNativeLogo(it)) {
        const lu = logoUrl(it, cfg.tmdb_image_domain);
        if (lu) html += '<img class="rg-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(lu) + '" alt="" />';
      }
      el.innerHTML = html;
      el._item = it;
      ring.appendChild(el);
      cards.push(el);
    }
    for (let i = 0; i < N; i++) cardAt(i);
    function setMeta(it) {
      if (cfg.hide_text || !it) return;
      meta.innerHTML = ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="rg-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="rg-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="rg-overview">' + escapeHtml(trimOverview(it.overview, 110)) + '</div>' : '');
    }
    setMeta(cards[0]._item);
    function rotate() {
      rotation -= step;
      frontIndex = (frontIndex + 1) % N;
      ring.style.transform = 'translateZ(' + (-radius) + 'px) rotateX(-6deg) rotateY(' + rotation + 'deg)';
      cards.forEach((c, i) => {
        c.classList.toggle('front', i === frontIndex);
        // 中间卡放大；侧卡轮到中间时带缩放过渡
        c.style.transform = 'rotateY(' + (i * step) + 'deg) translateZ(' + radius + 'px)' + (i === frontIndex ? ' scale(1.18)' : '');
      });
      // 背后的卡片换新图
      const backIdx = (frontIndex + Math.floor(N / 2)) % N;
      const it = items[(cursor++) % items.length];
      const el = cards[backIdx];
      const url = it ? pickUrl(it, cfg.image_type, cfg.tmdb_image_domain) : '';
      let html = url ? '<img src="' + escapeHtml(url) + '" alt="" draggable="false" />' : '';
      if (cfg.image_type === 'logo' && it && !hasNativeLogo(it)) {
        const lu = logoUrl(it, cfg.tmdb_image_domain);
        if (lu) html += '<img class="rg-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(lu) + '" alt="" />';
      }
      el.innerHTML = html;
      el._item = it;
      setMeta(cards[frontIndex]._item);
    }
    timer = setInterval(rotate, Math.max(4, cfg.interval || 8) * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearInterval(timer); timer = null; }
      else if (!document.hidden && !timer) timer = setInterval(rotate, Math.max(4, cfg.interval || 8) * 1000);
    });
    app.appendChild(root);
  }

  function renderPixelDissolve(app, cfg, items) {
    // 像素溶解：新照片以随机像素块点亮取代旧照片（Canvas）
    const root = document.createElement('div');
    root.className = 'effect-pixeldissolve' + (cfg.hide_text ? ' no-text' : '');
    const wrap = document.createElement('div'); wrap.className = 'px-root';
    const canvas = document.createElement('canvas'); canvas.className = 'px-canvas';
    wrap.appendChild(canvas);
    const meta = document.createElement('div'); meta.className = 'px-meta';
    if (!cfg.hide_text) wrap.appendChild(meta);
    const vig = document.createElement('div'); vig.className = 'px-vignette'; wrap.appendChild(vig);
    root.appendChild(wrap);

    const COLS = 28, ROWS = 16, DISSOLVE_MS = 1400;
    const ctx = canvas.getContext('2d');
    let curImg = null, queue = [], cursor = 0, timer = null, animating = false;
    function reshuffle() {
      queue = [...items];
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      cursor = 0;
    }
    function loadImg(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = async () => { try { await img.decode(); } catch (e) {} resolve(img); };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }
    async function nextPhoto() {
      let guard = 0;
      while (items.length && guard++ < items.length) {
        if (cursor >= queue.length) reshuffle();
        const it = queue[cursor++];
        const url = it ? pickUrl(it, cfg.image_type, cfg.tmdb_image_domain) : '';
        if (!url) continue;
        const img = await loadImg(url);
        if (img) return { img, item: it };
      }
      return null;
    }
    function drawCover(img, sx, sy, sw, sh, dx, dy, dw, dh) {
      sx = sx || 0; sy = sy || 0;
      const cw = canvas.width, ch = canvas.height;
      const s = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      const ow = img.naturalWidth * s, oh = img.naturalHeight * s;
      const ox = (cw - ow) / 2, oy = (ch - oh) / 2;
      const srcX = (sx / cw * ow - ox) / s;
      const srcY = (sy / ch * oh - oy) / s;
      const srcW = (sw === undefined ? cw : sw) / cw * ow / s;
      const srcH = (sh === undefined ? ch : sh) / ch * oh / s;
      ctx.drawImage(img, srcX, srcY, srcW, srcH,
        dx || 0, dy || 0, dw === undefined ? cw : dw, dh === undefined ? ch : dh);
    }
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (curImg) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawCover(curImg); }
    }
    function setMeta(it) {
      if (cfg.hide_text || !it) return;
      meta.innerHTML = ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="px-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="px-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="px-overview">' + escapeHtml(trimOverview(it.overview, 110)) + '</div>' : '');
    }
    async function transition() {
      if (animating) return;
      const next = await nextPhoto();
      if (!next) return;
      animating = true;
      setMeta(next.item);
      const cw = canvas.width, ch = canvas.height;
      const cellW = Math.ceil(cw / COLS), cellH = Math.ceil(ch / ROWS);
      const cells = Array.from({ length: COLS * ROWS }, (_, i) => i);
      for (let i = cells.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }
      if (curImg) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch); drawCover(curImg); }
      const start = performance.now();
      const stepFn = (now) => {
        const t = Math.min(1, (now - start) / DISSOLVE_MS);
        const reveal = Math.floor(t * cells.length);
        for (let k = 0; k < reveal; k++) {
          const id = cells[k];
          const gx = (id % COLS) * cellW, gy = Math.floor(id / COLS) * cellH;
          drawCover(next.img, gx, gy, cellW, cellH, gx, gy, cellW, cellH);
        }
        if (t < 1) requestAnimationFrame(stepFn);
        else {
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
          drawCover(next.img);
          curImg = next.img;
          animating = false;
        }
      };
      requestAnimationFrame(stepFn);
    }
    reshuffle();
    resize();
    window.addEventListener('resize', resize);
    nextPhoto().then(first => {
      if (first) {
        setMeta(first.item);
        curImg = first.img;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawCover(first.img);
      }
    });
    timer = setInterval(transition, Math.max(4, cfg.interval || 8) * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearInterval(timer); timer = null; }
      else if (!document.hidden && !timer) timer = setInterval(transition, Math.max(4, cfg.interval || 8) * 1000);
    });
    app.appendChild(root);
  }

  function renderDepthTunnel(app, cfg, items) {
    // 纵深穿梭：底部备选小图 → 抖动+绕圈热身 → 从纵深飞来（主图 contain 保持原比例）
    const root = document.createElement('div');
    root.className = 'effect-depthtunnel' + (cfg.hide_text ? ' no-text' : '');
    const wrap = document.createElement('div'); wrap.className = 'dt-root';
    const streaks = document.createElement('div'); streaks.className = 'dt-streaks'; wrap.appendChild(streaks);
    const thumbsBar = document.createElement('div'); thumbsBar.className = 'dt-thumbs'; wrap.appendChild(thumbsBar);
    const meta = document.createElement('div'); meta.className = 'dt-meta';
    if (!cfg.hide_text) wrap.appendChild(meta);
    const vig = document.createElement('div'); vig.className = 'dt-vignette'; wrap.appendChild(vig);
    root.appendChild(wrap);

    const THUMBS_N = 9;
    let queue = [], cursor = 0, timer = null, warming = false, zSeq = 0;
    const thumbs = [];
    function reshuffle() {
      queue = [...items];
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      cursor = 0;
    }
    function nextItem() {
      if (!items.length) return null;
      if (cursor >= queue.length) reshuffle();
      return queue[cursor++] || null;
    }
    function preload(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = async () => { try { await img.decode(); } catch (e) {} resolve(true); };
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }
    function fillThumbs() {
      // 有限扫描：连续 miss 满一轮队列长度即判定当前没有可用图片，进入空态，
      // 避免列表非空但全部缺图时 while 同步死循环卡死主线程
      const limit = Math.max(items.length, 1);
      let misses = 0;
      while (thumbs.length < THUMBS_N && misses < limit) {
        const it = nextItem();
        if (!it) break;
        const url = pickUrl(it, cfg.image_type, cfg.tmdb_image_domain);
        if (!url) { misses++; continue; }
        misses = 0;
        const el = document.createElement('div');
        el.className = 'dt-thumb';
        // 黑色深处随机散布：位置/大小/透明度/模糊/漂移节奏
        const depth = 0.35 + Math.random() * 0.65;
        const w = Math.round(56 + depth * 56);
        el.style.left = (4 + Math.random() * 88).toFixed(1) + '%';
        el.style.top = (6 + Math.random() * 80).toFixed(1) + '%';
        el.style.width = w + 'px';
        el.style.height = Math.round(w * 0.66) + 'px';
        el.style.opacity = (0.3 + depth * 0.35).toFixed(2);
        el.style.filter = 'blur(' + ((1 - depth) * 1.6).toFixed(1) + 'px)';
        el.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + 's';
        el.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
        el.innerHTML = '<img src="' + escapeHtml(url) + '" alt="" draggable="false" />';
        thumbsBar.appendChild(el);
        thumbs.push({ el, item: it });
      }
    }
    function setMeta(it) {
      if (cfg.hide_text || !it) return;
      meta.innerHTML = ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="dt-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="dt-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '');
    }
    async function spawn() {
      if (warming || !thumbs.length) return;
      warming = true;
      const t = thumbs[0];
      const url = await tryLoadCandidates(pickUrlCandidates(t.item, cfg.image_type, cfg.tmdb_image_domain));
      if (!url) {
        thumbs.shift(); t.el.remove(); fillThumbs();
        warming = false;
        return;
      }
      // 选中即螺旋飞出（无单独热身等待）
      t.el.remove();
      thumbs.shift();
      fillThumbs();
      setMeta(t.item);
      const el = document.createElement('div');
      el.className = 'dt-flyer';
      const dx = ((Math.random() - 0.5) * 30).toFixed(1) + 'vw';
      const dy = ((Math.random() - 0.5) * 20).toFixed(1) + 'vh';
      const dur = Math.round(Math.max(4, cfg.interval || 8) * 1000 * (0.92 + Math.random() * 0.1));
      el.style.setProperty('--dx', dx);
      el.style.setProperty('--dy', dy);
      el.style.animationDuration = dur + 'ms';
      el.style.zIndex = 5 + (++zSeq % 40);   // 图层递增：放大时压在所有旧图上
      let html = '<img src="' + escapeHtml(url) + '" alt="" draggable="false" />';
      if (cfg.image_type === 'logo' && !hasNativeLogo(t.item)) {
        const lu = logoUrl(t.item, cfg.tmdb_image_domain);
        if (lu) html += '<img class="dt-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(lu) + '" alt="" />';
      }
      el.innerHTML = html;
      wrap.insertBefore(el, meta.parentNode === wrap ? meta : thumbsBar);
      setTimeout(() => el.remove(), dur + 900);
      warming = false;
    }
    reshuffle();
    fillThumbs();
    spawn();
    timer = setInterval(spawn, Math.max(4, cfg.interval || 8) * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearInterval(timer); timer = null; }
      else if (!document.hidden && !timer) timer = setInterval(spawn, Math.max(4, cfg.interval || 8) * 1000);
    });
    app.appendChild(root);
  }

  function renderSliceFlip(app, cfg, items) {
    // 切片翻页：整幅照片切竖条，错峰 3D 翻转到下一张
    const root = document.createElement('div');
    root.className = 'effect-sliceflip' + (cfg.hide_text ? ' no-text' : '');
    const SLICES = 9, STAGGER = 70;
    const wrap = document.createElement('div'); wrap.className = 'sf-root';
    const stage = document.createElement('div'); stage.className = 'sf-stage';
    wrap.appendChild(stage);
    const meta = document.createElement('div'); meta.className = 'sf-meta';
    if (!cfg.hide_text) wrap.appendChild(meta);
    const vig = document.createElement('div'); vig.className = 'sf-vignette'; wrap.appendChild(vig);
    root.appendChild(wrap);

    let queue = [], cursor = 0, timer = null, flipping = false;
    const slices = [];
    function reshuffle() {
      queue = [...items];
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      cursor = 0;
    }
    function preload(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = async () => { try { await img.decode(); } catch (e) {} resolve(true); };
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }
    async function nextPhoto() {
      let guard = 0;
      while (items.length && guard++ < items.length) {
        if (cursor >= queue.length) reshuffle();
        const it = queue[cursor++];
        const url = it ? pickUrl(it, cfg.image_type, cfg.tmdb_image_domain) : '';
        if (!url) continue;
        if (!(await preload(url))) continue;
        return { url, logo: (it && !hasNativeLogo(it)) ? logoUrl(it, cfg.tmdb_image_domain) : '', item: it };
      }
      return null;
    }
    function faceStyle(i, url) {
      return 'background-image:' + (url ? 'url(' + url + ')' : 'none') + ';' +
        'background-size:' + (SLICES * 100) + '% 100%;' +
        'background-position:' + ((i / (SLICES - 1)) * 100) + '% center;';
    }
    function setMeta(it) {
      if (cfg.hide_text || !it) return;
      meta.innerHTML = ((cfg.image_type === 'logo' && !hasNativeLogo(it) && logoUrl(it, cfg.tmdb_image_domain)) ? '<img class="meta-logo" onload="this.parentElement.classList.toggle(\'meta-center\',this.naturalWidth>=this.naturalHeight)" src="' + logoUrl(it, cfg.tmdb_image_domain) + '" alt="" />' : '<div class="sf-title">' + escapeHtml(it.title) + '</div>') +
        ((it.year || it.type) ? '<div class="sf-sub">' + escapeHtml(it.year) + (it.year && it.type ? ' · ' : '') + escapeHtml(it.type) + '</div>' : '') +
        (it.overview ? '<div class="sf-overview">' + escapeHtml(trimOverview(it.overview, 110)) + '</div>' : '');
    }
    async function build() {
      const p = await nextPhoto();
      for (let i = 0; i < SLICES; i++) {
        const slice = document.createElement('div');
        slice.className = 'sf-slice';
        slice.style.left = (i * 100 / SLICES).toFixed(3) + '%';
        slice.style.width = (100 / SLICES).toFixed(3) + '%';
        const frontLogo = (cfg.image_type === 'logo' && p && p.logo) ? '<img class="sf-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(p.logo) + '" alt="" />' : '';
        slice.innerHTML =
          '<div class="sf-inner">' +
          '<div class="sf-face sf-front" style="' + faceStyle(i, p ? p.url : '') + '">' + frontLogo + '</div>' +
          '<div class="sf-face sf-back" style="' + faceStyle(i, p ? p.url : '') + '">' + frontLogo + '</div>' +
          '</div>';
        stage.appendChild(slice);
        slices.push({ el: slice.querySelector('.sf-inner'), flipped: false, i });
      }
      if (p) setMeta(p.item);
    }
    async function flip() {
      if (flipping || !slices.length) return;
      flipping = true;
      const p = await nextPhoto();
      if (!p) { flipping = false; return; }
      setMeta(p.item);
      const centerFirst = Math.random() < 0.5;
      slices.forEach(s => {
        // 新图装到隐藏面
        const face = s.flipped ? s.el.querySelector('.sf-front') : s.el.querySelector('.sf-back');
        const logoHtml = (cfg.image_type === 'logo' && p.logo) ? '<img class="sf-logo" onload="this.classList.toggle(\'logo-wide\',this.naturalWidth>=this.naturalHeight)" src="' + escapeHtml(p.logo) + '" alt="" />' : '';
        face.setAttribute('style', faceStyle(s.i, p.url));
        face.innerHTML = logoHtml;
        const delay = centerFirst
          ? Math.abs(s.i - (SLICES - 1) / 2) * STAGGER
          : s.i * STAGGER;
        s.el.style.transitionDelay = delay + 'ms';
        s.flipped = !s.flipped;
        s.el.classList.toggle('flipped', s.flipped);
      });
      setTimeout(() => { flipping = false; }, SLICES * STAGGER + 1100);
    }
    reshuffle();
    build();
    timer = setInterval(flip, Math.max(4, cfg.interval || 8) * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && timer) { clearInterval(timer); timer = null; }
      else if (!document.hidden && !timer) timer = setInterval(flip, Math.max(4, cfg.interval || 8) * 1000);
    });
    app.appendChild(root);
  }

  function renderEffect(cfg, items) {
    if (!items.length) { renderError('没有可用的海报数据。请确认插件已启用并配置了数据源。'); return; }
    const app = clearApp();
    const fn = ({photos:renderPhotos, floating:renderFloating, vintage:renderVintage, lightdance:renderLightDance, shiftingtiles:renderShiftingTiles, slidingpanels:renderSlidingPanels, ring3d:renderRingGallery, depthtunnel:renderDepthTunnel})[cfg.effect] || renderPhotos;
    fn(app, cfg, items);
  }

  function renderError(msg) {
    const app = document.getElementById('app');
    app.innerHTML = '<div class="placeholder error">' + escapeHtml(msg) + '</div>';
  }

  function renderWaiting() {
    const app = document.getElementById('app');
    app.innerHTML = '<div class="placeholder waiting">请等候拉取图片数据…</div>';
  }

  async function boot() {
    try {
      const { cfg, items } = await load();
      if (!cfg.enabled) { renderError('插件未启用。请在 MoviePilot 启用"全屏海报墙"插件。'); return; }
      if (!items.length) {
        // 数据未就绪：红字闪烁提示，每 5 秒重试
        renderWaiting();
        setTimeout(boot, 5000);
        return;
      }
      setTopBar(cfg, items);
      renderEffect(cfg, items);
      startFullscreenCountdown();
    } catch (e) {
      renderError('数据加载失败：' + (e && e.message || e));
    }
  }
  boot();
})();

// 倒数 3 秒后尝试进入全屏；浏览器要求用户手势，
// 若自动进入失败则降级为右下角常驻提示，点击任意处即进全屏
function startFullscreenCountdown() {
  const ov = document.createElement('div');
  ov.className = 'fs-countdown';
  ov.innerHTML = '<div class="fs-cd-num">3</div><div class="fs-cd-hint">秒后进入全屏 · 点击立即进入</div>';
  document.body.appendChild(ov);
  let n = 3;
  let finished = false;
  const numEl = ov.querySelector('.fs-cd-num');
  const hintEl = ov.querySelector('.fs-cd-hint');
  function cleanup() {
    finished = true;
    clearInterval(iv);
    ov.remove();
    document.removeEventListener('click', onClick, true);
    document.removeEventListener('keydown', onClick, true);
  }
  function tryFullscreen() {
    if (document.fullscreenElement) { cleanup(); return; }
    document.documentElement.requestFullscreen()
      .then(() => cleanup())
      .catch(() => {
        // 无用户手势：降级为不遮挡的小提示，2.5 秒后自动隐藏；
        // 点击/按键监听保持常驻，第一次交互即进全屏
        ov.classList.add('fs-cd-mini');
        numEl.style.display = 'none';
        hintEl.textContent = '点击任意处进入全屏';
        setTimeout(() => {
          if (!finished && document.body.contains(ov)) {
            ov.classList.add('fs-cd-fade');
            setTimeout(() => ov.remove(), 600);
          }
        }, 2500);
      });
  }
  function onClick() { if (!finished) tryFullscreen(); }
  document.addEventListener('click', onClick, true);
  document.addEventListener('keydown', onClick, true);
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); tryFullscreen(); return; }
    numEl.textContent = n;
  }, 1000);
}

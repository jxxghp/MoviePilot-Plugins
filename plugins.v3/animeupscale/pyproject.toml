[project]
name = "moviepilot-plugin-animeupscale"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "opencv-python-headless==4.10.0.84",
    "safetensors>=0.4,<1",
    "spandrel>=0.4,<0.5",
    "spandrel-extra-arches>=0.2,<0.3",
    "torch==2.13.0+cu126",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.moviepilot.dependency-gate]
platforms = ["linux-x64"]
